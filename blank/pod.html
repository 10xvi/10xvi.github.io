<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POD.AGI Integrated Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .insight-text {
            text-align: left !important;
            display: block !important;
            width: 100% !important;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .region-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        .rib-pattern {
            background-image: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 49px,
                rgba(0, 0, 0, 0.02) 50px
            );
            z-index: 1;
        }

        .pod-inner-bezel {
            box-shadow: inset 0 0 40px rgba(0,0,0,0.03), 0 1px 2px rgba(255,255,255,0.8);
        }

        @keyframes pod-pulse {
            0% { box-shadow: 0 0 60px -20px rgba(59,130,246,0.3); }
            50% { box-shadow: 0 0 100px -10px rgba(59,130,246,0.5); }
            100% { box-shadow: 0 0 60px -20px rgba(59,130,246,0.3); }
        }
        .pod-active-glow {
            animation: pod-pulse 4s ease-in-out infinite;
        }

        #sidebar::-webkit-scrollbar {
            width: 4px;
        }
        #sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        #sidebar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Mobile Layout Transitions */
        @media (max-width: 767px) {
            #pod-hull, #body-hub-container, main {
                transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            }
            
            /* Background visual updated to 99% visibility and minimal blur when sidebar is active */
            .sidebar-active main {
                opacity: 0.99;
                filter: blur(1px);
                pointer-events: none;
            }

            /* The sidebar itself remains a translucent overlay */
            #sidebar {
                background-color: rgba(255, 255, 255, 0.7) !important;
                backdrop-filter: blur(12px);
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-700 h-screen text-[13px] select-none">

    <div id="app" class="flex h-full relative overflow-hidden flex-col md:flex-row">
        
        <!-- Main Interaction Stage -->
        <main class="flex-1 relative flex items-center justify-center p-4 md:p-16 overflow-visible transition-all duration-500 ease-in-out min-h-0">
            
            <!-- PHYSICAL POD CONTAINER -->
            <div id="pod-hull" class="absolute w-[95%] md:w-[560px] h-[75vh] sm:h-[85vh] md:h-[92vh] flex items-center justify-center overflow-visible z-0 origin-center">
                <div class="absolute inset-0 rounded-[4rem] md:rounded-[8.5rem] bg-slate-200 shadow-xl pointer-events-none translate-y-1"></div>
                
                <button id="pod-ambient-btn" class="relative inset-0 w-full h-full rounded-[3.8rem] md:rounded-[8rem] transition-all duration-700 focus:outline-none ring-1 ring-slate-300 border-b-8 border-slate-400 bg-gradient-to-b from-slate-100 via-white to-slate-50 shadow-2xl overflow-hidden hover:ring-blue-300 group">
                    <div class="absolute inset-2 md:inset-4 rounded-[3.5rem] md:rounded-[7rem] border border-slate-200/50 pod-inner-bezel pointer-events-none"></div>
                    <div class="absolute inset-0 rib-pattern pointer-events-none opacity-40"></div>
                    
                    <div id="pod-sync-overlay" class="absolute inset-0 pointer-events-none rounded-[3.8rem] md:rounded-[8rem] overflow-hidden"></div>
                </button>
            </div>
            
            <!-- BODY HUB -->
            <div id="body-hub-container" class="relative h-[65vh] sm:h-[75vh] md:h-[82vh] aspect-[358.5/1086] flex items-center justify-center pointer-events-none z-10 overflow-visible origin-center">
                <svg viewBox="0 0 358.5 1086" class="w-full h-full pointer-events-none max-h-full">
                    <path id="body-silhouette" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"></path>
                </svg>

                <div id="body-interaction-layer" class="absolute inset-0 z-20 pointer-events-auto"></div>

                <!-- Label Bubble -->
                <div id="label-bubble-container" class="absolute -bottom-8 md:-bottom-16 left-1/2 -translate-x-1/2 w-full flex justify-center z-[110] hidden">
                    <div class="bg-white/50 backdrop-blur-sm px-5 py-2.5 rounded-full shadow-2xl border border-white/50 flex items-center gap-3">
                         <div id="bubble-dot" class="w-2 h-2 rounded-full animate-pulse"></div>
                         <span id="bubble-text" class="text-[10px] font-bold text-slate-800 uppercase tracking-[0.2em] whitespace-nowrap"></span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Sidebar Registry -->
        <aside id="sidebar" class="fixed md:relative inset-x-0 bottom-0 md:inset-y-0 h-0 md:h-full w-full md:w-0 bg-white border-t md:border-t-0 md:border-l border-slate-200 p-0 overflow-y-auto z-[150] transition-all duration-500 ease-in-out opacity-0 pointer-events-none shadow-[0_-20px_50px_rgba(0,0,0,0.1)] md:shadow-2xl overflow-x-hidden rounded-t-[2.5rem] md:rounded-t-none">
            <div class="w-full md:min-w-[416px] max-w-[100vw]">
                <!-- Modal Bar Indicator for Mobile -->
                <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mt-4 md:hidden"></div>
                
                <header class="relative p-6 md:p-8 pb-0">
                    <button id="close-sidebar" class="absolute top-6 md:top-8 right-6 md:right-8 p-2 bg-slate-50 hover:bg-slate-100 rounded-md text-slate-400 transition-all">
                        <i data-lucide="x" class="w-5 h-5 md:w-4 md:h-4"></i>
                    </button>
                    <h2 id="sidebar-title" class="text-2xl md:text-3xl font-semibold text-slate-900 tracking-tight leading-none italic uppercase pt-2 pr-12"></h2>
                    
                    <div class="flex items-center justify-end mt-4">
                        <!-- Toggle Controls -->
                        <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 relative">
                            <div id="toggle-indicator" class="absolute top-0.5 bottom-0.5 left-0.5 w-[calc(50%-1px)] bg-white rounded-md shadow-sm border border-slate-200/50 transition-all duration-300 ease-in-out"></div>
                            <button id="toggle-group-hardware" class="relative z-10 px-4 py-1.5 rounded-md text-[9px] font-bold uppercase tracking-wider transition-all text-slate-900">Hardware</button>
                            <button id="toggle-group-interaction" class="relative z-10 px-4 py-1.5 rounded-md text-[9px] font-bold uppercase tracking-wider transition-all text-slate-400">Interaction</button>
                        </div>
                    </div>
                </header>

                <!-- Standard Sections -->
                <div id="standard-registry-sections" class="space-y-6 px-6 md:px-8 pb-12 mt-8">
                    <!-- Sensors -->
                    <section id="sensor-section" class="border border-slate-100 rounded-md overflow-hidden bg-slate-50/30 shadow-sm transition-all">
                        <button id="toggle-sensors" class="w-full flex items-center justify-between p-4 md:p-5 hover:bg-slate-50 transition-colors">
                            <div class="flex items-center gap-3">
                                <i data-lucide="database" id="sensor-header-icon" class="w-4 h-4 text-slate-600"></i>
                                <h3 class="text-[10px] font-bold text-slate-900 uppercase tracking-widest">Sensing Nodes</h3>
                                <div id="sensor-count" class="text-white px-2 py-0.5 rounded text-[9px] font-mono font-medium bg-slate-400">0</div>
                            </div>
                            <i id="sensor-chevron" data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                        </button>
                        <div id="sensor-list" class="p-4 md:p-5 pt-0 hidden space-y-4"></div>
                    </section>

                    <!-- Actuators -->
                    <section id="actuator-section" class="border border-slate-100 rounded-md overflow-hidden bg-emerald-50/10 shadow-sm transition-all">
                        <button id="toggle-actuators" class="w-full flex items-center justify-between p-4 md:p-5 hover:bg-emerald-50/20 transition-colors">
                            <div class="flex items-center gap-3">
                                <i data-lucide="zap" class="w-4 h-4 text-emerald-500"></i>
                                <h3 class="text-[10px] font-bold text-slate-900 uppercase tracking-widest">Physical Actuation</h3>
                                <div id="actuator-count" class="bg-emerald-600 text-white px-2 py-0.5 rounded text-[9px] font-mono font-medium">0</div>
                            </div>
                            <i id="actuator-chevron" data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                        </button>
                        <div id="actuator-list" class="p-4 md:p-5 pt-0 hidden space-y-4"></div>
                    </section>
                </div>

                <!-- Unified Interaction List -->
                <div id="interaction-registry-unified" class="hidden px-6 md:px-8 space-y-8 pb-12 mt-8"></div>
            </div>
        </aside>

        <!-- Floating Help Button -->
        <button id="help-btn" class="fixed bottom-6 md:bottom-8 left-6 md:left-8 z-[120] w-12 h-12 bg-white/80 backdrop-blur-md border border-slate-200 rounded-full shadow-2xl flex items-center justify-center hover:bg-white transition-all active:scale-90 group">
            <i data-lucide="help-circle" class="w-6 h-6 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
        </button>

        <!-- Glossary Modal Overlay -->
        <div id="glossary-modal" class="fixed inset-0 z-[300] bg-slate-50/95 backdrop-blur-xl overflow-y-auto hidden animate-in fade-in duration-300">
            <button id="close-glossary" class="fixed top-6 right-6 z-[310] p-3 bg-white/80 backdrop-blur rounded-full shadow-lg border border-slate-200 hover:bg-white transition-all">
                <i data-lucide="x" class="w-6 h-6 text-slate-600"></i>
            </button>

            <div class="max-w-6xl mx-auto px-6 py-12 md:py-20">
                <header class="mb-12">
                    <div class="flex flex-col md:flex-row gap-6">
                        <div class="relative flex-1">
                            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                            <input type="text" id="glossary-search" placeholder="Filter terms..." class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm transition-all shadow-sm focus:ring-2 focus:ring-blue-100 outline-none">
                        </div>
                        <div class="flex gap-2">
                            <button id="glossary-show-sensors" class="px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest transition-all shadow-sm bg-slate-900 text-white">Sensors</button>
                            <button id="glossary-show-actuators" class="px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest transition-all shadow-sm bg-white text-slate-500 border border-slate-200">Actuators</button>
                        </div>
                    </div>
                </header>
                <main id="glossary-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></main>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loader" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-[400] flex flex-col items-center justify-center gap-4">
            <div class="relative">
                <i data-lucide="refresh-cw" class="w-10 h-10 animate-spin text-orange-500"></i>
                <div class="absolute inset-0 animate-ping rounded-full bg-orange-200/50 scale-150"></div>
            </div>
            <p class="text-[9px] font-semibold uppercase tracking-[0.3em] text-orange-600">Synchronizing Pod Infrastructure</p>
        </div>
    </div>

        // --- CORE LOGIC ---
        function parseCSV(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
            if (lines.length < 1) return [];
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            return lines.slice(1).map(line => {
                const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"|"$/g, ''));
                let obj = {};
                headers.forEach((h, i) => obj[h] = values[i] || "");
                return obj;
            });
        }

        async function fetchData() {
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            try {
                const [sRes, aRes, gRes] = await Promise.all([
                    fetch(SENSORS_URL).catch(() => null),
                    fetch(ACTUATORS_URL).catch(() => null),
                    fetch(GLOSSARY_URL).catch(() => null)
                ]);
                if (sRes) { state.sensors = parseCSV(await sRes.text()); }
                if (aRes) { state.actuators = parseCSV(await aRes.text()); }
                if (gRes) {
                    const gText = await gRes.text();
                    const lines = gText.split(/\r?\n/).filter(l => l.trim() !== "");
                    if (lines.length > 1) {
                        state.glossary.sensors = [];
                        state.glossary.actuators = [];
                        for (let i = 1; i < lines.length; i++) {
                            const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"|"$/g, ''));
                            if (values[0]) state.glossary.sensors.push({ name: values[0], def: values[1] });
                            if (values[2]) state.glossary.actuators.push({ name: values[2], def: values[3] });
                        }
                    }
                }
            } catch (err) { console.error("Fetch Error:", err); } 
            finally {
                setTimeout(() => {
                    loader.style.display = 'none';
                    renderBodyLayer();
                    updateUI();
                }, 800);
            }
        }

        function setSelectedZone(zone) {
            state.selectedZone = zone;
            state.isSensorsExpanded = false;
            state.isActuatorsExpanded = false;
            state.expandedInsights.clear();
            updateUI();
        }

        function setHoveredZone(id) {
            state.hoveredZoneId = id;
            updatePodHighlights();
            updateBodySegments();
        }

        function toggleSection(type) {
            if (type === 'sensors') state.isSensorsExpanded = !state.isSensorsExpanded;
            if (type === 'actuators') state.isActuatorsExpanded = !state.isActuatorsExpanded;
            updateSidebarRegistry();
        }

        function toggleMechanism(mechId) {
            if (state.expandedInsights.has(mechId)) state.expandedInsights.delete(mechId);
            else state.expandedInsights.add(mechId);
            updateSidebarRegistry();
        }

        function updateUI() {
            const appEl = document.getElementById('app');
            if (state.selectedZone) {
                appEl.classList.add('sidebar-active');
            } else {
                appEl.classList.remove('sidebar-active');
            }
            updatePodHighlights();
            updateBodySegments();
            updateLabelBubble();
            updateSidebar();
        }

        function renderBodyLayer() {
            const container = document.getElementById('body-interaction-layer');
            const podSync = document.getElementById('pod-sync-overlay');
            container.innerHTML = ''; podSync.innerHTML = '';
            document.getElementById('body-silhouette').setAttribute('d', BODY_PATH);
            const vGap = 0.2; const hGap = 0.6; 
            ZONES.forEach(zone => {
                if (zone.id === 'arms') {
                    ['L', 'R'].forEach(side => {
                        const h = document.createElement('div');
                        h.id = `pod-sync-${zone.id}-${side}`;
                        h.className = 'absolute transition-all duration-700 pointer-events-none opacity-0 bg-blue-500/10 border-t border-b border-blue-200/40 z-10';
                        h.style.top = `${zone.topPct}%`; h.style.height = `${zone.bottomPct - zone.topPct}%`;
                        const highlightWidth = 30;
                        if (side === 'L') { h.style.left = '0'; h.style.width = `${highlightWidth}%`; h.style.borderRight = '1px solid rgba(59,130,246,0.1)'; }
                        else { h.style.right = '0'; h.style.width = `${highlightWidth}%`; h.style.borderLeft = '1px solid rgba(59,130,246,0.1)'; }
                        podSync.appendChild(h);
                    });
                } else {
                    const highlight = document.createElement('div');
                    highlight.id = `pod-sync-${zone.id}`;
                    highlight.className = 'absolute left-0 right-0 transition-all duration-700 pointer-events-none opacity-0';
                    highlight.style.top = `${zone.topPct}%`; highlight.style.height = `${zone.bottomPct - zone.topPct}%`;
                    if (zone.leftPct !== undefined && zone.id !== 'lumbar') {
                        highlight.style.left = `${zone.leftPct}%`; highlight.style.right = `${100 - zone.rightPct}%`;
                        highlight.classList.add('border-l', 'border-r', 'border-blue-200/40');
                    } else { highlight.style.left = '0'; highlight.style.right = '0'; }
                    podSync.appendChild(highlight);
                }
                const createButton = (id, clipPath) => {
                    const btn = document.createElement('button');
                    btn.className = 'absolute inset-0 transition-all duration-500 focus:outline-none';
                    btn.style.clipPath = clipPath; btn.style.webkitClipPath = clipPath;
                    btn.onmouseenter = () => setHoveredZone(id);
                    btn.onmouseleave = () => setHoveredZone(null);
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        const foundZone = ZONES.find(z => z.id === id);
                        setSelectedZone(state.selectedZone?.id === id ? null : foundZone);
                    };
                    btn.innerHTML = `<svg viewBox="0 0 358.5 1086" class="w-full h-full pointer-events-none transition-all duration-500"><path id="path-${id}" d="${REGION_PATH}" class="transition-all duration-300" style="fill: #f97316; opacity: 0.15; stroke: #fdba74; stroke-width: 0.75;"></path></svg>`;
                    container.appendChild(btn);
                };
                if (zone.id === 'arms') {
                    createButton(zone.id, `inset(${zone.topPct + vGap}% ${100 - (ARM_WIDTH_PCT - hGap)}% ${100 - (zone.bottomPct - vGap)}% 0%)`);
                    createButton(zone.id, `inset(${zone.topPct + vGap}% 0% ${100 - (zone.bottomPct - vGap)}% ${100 - (ARM_WIDTH_PCT - hGap)}%)`);
                } else if (zone.leftPct !== undefined) {
                    createButton(zone.id, `inset(${zone.topPct + vGap}% ${100 - (zone.rightPct - hGap)}% ${100 - (zone.bottomPct - vGap)}% ${zone.leftPct + hGap}%)`);
                } else if (zone.id === 'legs') {
                    const legTop = zone.topPct + vGap;
                    createButton(zone.id, `polygon(${CENTER_LEFT + hGap}% ${legTop}%, ${CENTER_RIGHT - hGap}% ${legTop}%, ${CENTER_RIGHT - hGap}% 65%, 100% 65%, 100% 100%, 0% 100%, 0% 65%, ${CENTER_LEFT + hGap}% 65%)`);
                } else if (zone.id === 'cranial') { createButton(zone.id, `inset(0 0 ${100 - (zone.bottomPct - vGap)}% 0)`); } 
                else if (zone.id === 'cervical') { createButton(zone.id, `inset(${zone.topPct + vGap}% 0 ${100 - (zone.bottomPct - vGap)}% 0)`); }
            });
        }

        function updatePodHighlights() {
            const ambientBtn = document.getElementById('pod-ambient-btn');
            const isPodSelected = state.selectedZone?.id === 'pod';
            ZONES.forEach(zone => {
                if (zone.id === 'arms') { ['L', 'R'].forEach(side => { const el = document.getElementById(`pod-sync-${zone.id}-${side}`); if (el) el.style.opacity = '0'; }); }
                else { const el = document.getElementById(`pod-sync-${zone.id}`); if (el) el.style.opacity = '0'; }
            });
            if (isPodSelected) ambientBtn.className = 'relative inset-0 w-full h-full rounded-[3.8rem] md:rounded-[8rem] transition-all duration-700 focus:outline-none ring-4 ring-blue-500 border-b-8 border-blue-600 bg-gradient-to-b from-blue-100 via-blue-50 to-white overflow-hidden pod-active-glow shadow-blue-500/20 shadow-2xl';
            else ambientBtn.className = 'relative inset-0 w-full h-full rounded-[3.8rem] md:rounded-[8rem] transition-all duration-700 focus:outline-none ring-1 ring-slate-300 border-b-8 border-slate-400 bg-gradient-to-b from-slate-100 via-white to-slate-50 shadow-2xl overflow-hidden hover:ring-blue-300 group';
            const activeZoneId = state.selectedZone?.id || state.hoveredZoneId;
            const isSelectMode = !!state.selectedZone;
            const zone = ZONES.find(z => z.id === activeZoneId);
            if (zone && activeZoneId !== 'pod') {
                if (zone.id === 'arms') {
                    ['L', 'R'].forEach(side => { const el = document.getElementById(`pod-sync-${zone.id}-${side}`); if (el) el.style.opacity = isSelectMode ? '1' : '0.4'; });
                } else {
                    const el = document.getElementById(`pod-sync-${zone.id}`);
                    if (el) {
                        el.style.opacity = isSelectMode ? '1' : '0.4';
                        el.className = `absolute left-0 right-0 transition-all duration-700 bg-blue-500/10 border-t border-b border-blue-200/40 pointer-events-none z-10`;
                        if (zone.leftPct !== undefined && zone.id !== 'lumbar') { el.style.left = `${zone.leftPct}%`; el.style.right = `${100 - zone.rightPct}%`; el.classList.add('border-l', 'border-r'); }
                        else { el.style.left = '0'; el.style.right = '0'; el.classList.remove('border-l', 'border-r'); }
                        let start = zone.topPct - 4; let end = zone.bottomPct + 4;
                        if (zone.id === 'cranial') start = 0; if (zone.id === 'legs') end = 100;
                        start = Math.max(0, start); end = Math.min(100, end);
                        el.style.top = `${start}%`; el.style.height = `${end - start}%`;
                    }
                }
            }
        }

        function updateBodySegments() {
            ZONES.forEach(zone => {
                const paths = document.querySelectorAll(`[id="path-${zone.id}"]`);
                if (paths.length > 0) {
                    const isSelected = state.selectedZone?.id === zone.id;
                    const isHovered = state.hoveredZoneId === zone.id;
                    paths.forEach(path => {
                        path.style.opacity = isSelected ? 0.75 : isHovered ? 0.4 : 0.2;
                        path.style.stroke = isSelected || isHovered ? '#ea580c' : '#fdba74';
                        path.style.strokeWidth = isSelected ? '2px' : '0.75px';
                    });
                }
            });
        }

        function updateLabelBubble() {
            const container = document.getElementById('label-bubble-container');
            const text = document.getElementById('bubble-text');
            const dot = document.getElementById('bubble-dot');
            if (state.selectedZone) {
                container.classList.remove('hidden'); text.innerText = state.selectedZone.name;
                dot.className = `w-2 h-2 rounded-full animate-pulse shadow-[0_0_8px_rgba(0,0,0,0.1)] ${state.selectedZone.id === 'pod' ? 'bg-blue-600' : 'bg-orange-600'}`;
            } else container.classList.add('hidden');
        }

        function updateSidebar() {
            const sidebar = document.getElementById('sidebar');
            const title = document.getElementById('sidebar-title');
            if (state.selectedZone) {
                sidebar.classList.remove('w-0', 'p-0', 'border-l-0', 'opacity-0', 'pointer-events-none', 'h-0');
                sidebar.classList.add('md:w-[480px]', 'opacity-100', 'pointer-events-auto', 'h-full');
                title.innerText = state.selectedZone.name;
                updateSidebarRegistry();
            } else {
                sidebar.classList.add('w-0', 'p-0', 'border-l-0', 'opacity-0', 'pointer-events-none', 'h-0');
                sidebar.classList.remove('md:w-[480px]', 'opacity-100', 'pointer-events-auto', 'h-full');
            }
        }

        function getHardwareValue(obj, keys) {
            const normalizedKeys = keys.map(x => x.toLowerCase());
            const foundKey = Object.keys(obj).find(k => normalizedKeys.includes(k.trim().toLowerCase()));
            return foundKey ? obj[foundKey] : "";
        }

        function renderCard(item, isActuator, activeColorClass) {
            const domain = DOMAINS_META[item.resolvedDomainId] || DOMAINS_META.D009;
            const mechEntries = Array.from(item.mechanisms.entries());
            const hardwareId = isActuator ? (item.ActuatorID || "") : (item.HardwareID || "");
            const activeColor = isActuator ? 'emerald' : activeColorClass;

            if (state.groupingMode === 'interaction') {
                return `
                    <div class="flex items-center justify-between p-3 bg-white border border-slate-100 rounded-md hover:border-${activeColor}-200 transition-all shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-6 h-6 rounded bg-${activeColor}-50 flex items-center justify-center">
                                <i data-lucide="${domain.icon}" class="w-3 h-3 text-${activeColor}-600"></i>
                            </div>
                            <span class="text-xs font-semibold text-slate-800 uppercase tracking-tight">${item.displayName}</span>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="group p-4 md:p-5 bg-white border border-slate-100 rounded-md hover:border-${activeColor}-200 transition-all shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2 opacity-50">
                                <i data-lucide="${domain.icon}" class="w-3 h-3 text-${activeColor}-600"></i>
                                <span class="text-[8px] font-semibold uppercase tracking-widest text-${activeColor}-600">${domain.name}</span>
                            </div>
                            <h4 class="text-sm font-semibold text-slate-900 group-hover:text-${activeColor}-700 transition-colors uppercase leading-tight">${item.displayName}</h4>
                        </div>
                        <span class="text-[9px] font-mono text-slate-200 font-semibold ml-2 uppercase">${hardwareId}</span>
                    </div>
                    <div class="space-y-4">
                        ${mechEntries.map(([mechName, insights]) => {
                            const insightsArr = Array.from(insights);
                            const uniqueMechId = `${hardwareId}-${mechName}`.replace(/\s+/g, '-').toLowerCase();
                            const isExpanded = state.expandedInsights.has(uniqueMechId);
                            return `
                                <div class="space-y-2">
                                    <button onclick="toggleMechanism('${uniqueMechId}')" class="w-full flex items-center justify-between group/btn text-left">
                                        <div class="flex items-center gap-2 text-[9px] text-slate-500 font-bold uppercase tracking-widest leading-snug">
                                            <i data-lucide="chevron-right" class="w-2.5 h-2.5 text-${activeColor}-400 shrink-0 transition-transform ${isExpanded ? 'rotate-90' : ''}"></i>
                                            ${mechName}
                                        </div>
                                    </button>
                                    ${isExpanded && insightsArr.length ? `
                                        <div class="p-3 bg-${activeColor}-50/30 rounded border border-${activeColor}-100/50 space-y-2 animate-in fade-in slide-in-from-top-1 duration-200">
                                            ${insightsArr.map(ins => `<p class="text-[10px] text-left w-full leading-relaxed text-slate-600 italic font-medium">${ins}</p>`).join('')}
                                        </div>` : ''}
                                </div>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function updateSidebarRegistry() {
            if (!state.selectedZone) return;
            const filterByRegion = (list) => list.filter(item => {
                const rawRegion = (item["Target Region"] || item["TargetRegion"] || "").toLowerCase().trim();
                const regionList = rawRegion.split(',').map(r => r.trim());
                const currentZoneId = state.selectedZone.id.toLowerCase();
                return regionList.some(r => r === currentZoneId || synonyms[r] === currentZoneId);
            });
            const groupDataWithMapping = (list, nameKeys, isSensor) => {
                const grouped = []; const map = new Map();
                list.forEach(item => {
                    const hardwareName = getHardwareValue(item, nameKeys) || item.HardwareID || item.ActuatorID;
                    if (!hardwareName) return;
                    if (!map.has(hardwareName)) {
                        let resolvedDomainId = item.DomainID;
                        if (!resolvedDomainId || !DOMAINS_META[resolvedDomainId]) {
                            resolvedDomainId = domainMapping[(item.Domain || item.DomainName || "").toLowerCase().trim()] || "D009";
                        }
                        map.set(hardwareName, { ...item, displayName: hardwareName, resolvedDomainId, isSensor, mechanisms: new Map() });
                        grouped.push(map.get(hardwareName));
                    }
                    const mechanismName = isSensor ? getHardwareValue(item, ["Detection Method", "DetectionMethod", "DetectionMethodName"]) : getHardwareValue(item, ["Actuator Mechanism", "MechanismName", "Mechanism", "Delivery Method"]);
                    const insight = getHardwareValue(item, ["Insight Name", "InsightName", "Required Insight"]);
                    const hardwareEntry = map.get(hardwareName);
                    const finalMechName = mechanismName || "Standard Operating Mode";
                    if (!hardwareEntry.mechanisms.has(finalMechName)) hardwareEntry.mechanisms.set(finalMechName, new Set());
                    if (insight) hardwareEntry.mechanisms.get(finalMechName).add(insight);
                });
                return grouped;
            };

            const filteredSensors = filterByRegion(state.sensors);
            const filteredActuators = filterByRegion(state.actuators);
            const activeColorClass = state.selectedZone.id === 'pod' ? 'blue' : 'orange';
            
            // Header Color UI Fix
            const sIcon = document.getElementById('sensor-header-icon');
            const sCountBadge = document.getElementById('sensor-count');
            sIcon.className = `w-4 h-4 text-${activeColorClass}-600`;
            sCountBadge.className = `text-white px-2 py-0.5 rounded text-[9px] font-mono font-medium bg-${activeColorClass}-600`;

            const stdSections = document.getElementById('standard-registry-sections');
            const interactionSections = document.getElementById('interaction-registry-unified');

            if (state.groupingMode === 'standard') {
                stdSections.classList.remove('hidden');
                interactionSections.classList.add('hidden');
                
                const sList = document.getElementById('sensor-list');
                const aList = document.getElementById('actuator-list');
                sList.className = state.isSensorsExpanded ? 'p-4 md:p-5 pt-0 block space-y-4' : 'hidden';
                aList.className = state.isActuatorsExpanded ? 'p-4 md:p-5 pt-0 block space-y-4' : 'hidden';

                const groupedS = groupDataWithMapping(filteredSensors, ["Hardware Elements", "HardwareElements"], true);
                const groupedA = groupDataWithMapping(filteredActuators, ["Actuator Name", "ActuatorName"], false);

                document.getElementById('sensor-count').innerText = groupedS.length;
                document.getElementById('actuator-count').innerText = groupedA.length;

                sList.innerHTML = groupedS.length ? groupedS.map(item => renderCard(item, false, activeColorClass)).join('') : '<div class="py-6 text-center opacity-20 text-[9px] font-bold uppercase tracking-widest text-slate-400">Registry Unpopulated</div>';
                aList.innerHTML = groupedA.length ? groupedA.map(item => renderCard(item, true, activeColorClass)).join('') : '<div class="py-6 text-center opacity-20 text-[9px] font-bold uppercase tracking-widest text-slate-400">Registry Offline</div>';
            } else {
                stdSections.classList.add('hidden');
                interactionSections.classList.remove('hidden');

                const allItems = [
                    ...groupDataWithMapping(filteredSensors, ["Hardware Elements", "HardwareElements"], true),
                    ...groupDataWithMapping(filteredActuators, ["Actuator Name", "ActuatorName"], false)
                ];

                const interactionMap = new Map();
                allItems.forEach(item => {
                    const interaction = (item["Interaction"] || "General").trim() || "General";
                    if (!interactionMap.has(interaction)) interactionMap.set(interaction, []);
                    interactionMap.get(interaction).push(item);
                });

                const sortedInteractions = Array.from(interactionMap.entries()).sort((a, b) => b[1].length - a[1].length);

                interactionSections.innerHTML = sortedInteractions.map(([name, groupItems]) => `
                    <div class="mb-4">
                        <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-2">
                            <h5 class="text-xs font-bold text-slate-900 uppercase tracking-[0.1em]">${name}</h5>
                            <span class="text-[9px] font-mono text-slate-300 font-bold">${groupItems.length} Nodes</span>
                        </div>
                        <div class="space-y-2">
                            ${groupItems.map(item => renderCard(item, !item.isSensor, activeColorClass)).join('')}
                        </div>
                    </div>
                `).join('');
            }
            
            document.getElementById('sensor-chevron').setAttribute('data-lucide', state.isSensorsExpanded ? 'chevron-down' : 'chevron-right');
            document.getElementById('actuator-chevron').setAttribute('data-lucide', state.isActuatorsExpanded ? 'chevron-down' : 'chevron-right');
            lucide.createIcons();
        }

        function renderGlossary() {
            const grid = document.getElementById('glossary-grid');
            const activeData = state.glossary[state.glossaryView] || [];
            const filtered = activeData.filter(item => item.name.toLowerCase().includes(state.glossarySearch.toLowerCase()) || (item.def && item.def.toLowerCase().includes(state.glossarySearch.toLowerCase())));
            
            grid.innerHTML = filtered.length ? filtered.map(item => {
                const color = state.glossaryView === 'sensors' ? 'orange' : 'emerald';
                const icon = state.glossaryView === 'sensors' ? 'database' : 'zap';
                return `<div class="glass-panel p-6 rounded-3xl border border-slate-200 transition-all hover:shadow-xl group">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-8 h-8 rounded-full bg-${color}-50 flex items-center justify-center"><i data-lucide="${icon}" class="w-4 h-4 text-${color}-600"></i></div>
                        <h3 class="text-sm font-bold text-slate-900 uppercase group-hover:text-${color}-600 transition-colors">${item.name}</h3>
                    </div>
                    <p class="text-[12px] leading-relaxed text-slate-500 italic">${item.def || 'Offline'}</p>
                </div>`;
            }).join('') : '<div class="col-span-full py-20 text-center opacity-30 text-xs italic">No matching terms found.</div>';
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons(); fetchData();
            document.getElementById('pod-ambient-btn').onclick = () => { setSelectedZone(state.selectedZone?.id === 'pod' ? null : { id: 'pod', name: 'Pod Environment' }); };
            document.getElementById('close-sidebar').onclick = () => setSelectedZone(null);
            document.getElementById('toggle-sensors').onclick = () => toggleSection('sensors');
            document.getElementById('toggle-actuators').onclick = () => toggleSection('actuators');
            const btnStd = document.getElementById('toggle-group-hardware');
            const btnInt = document.getElementById('toggle-group-interaction');
            
            const updateToggleUI = () => {
                const indicator = document.getElementById('toggle-indicator');
                if (state.groupingMode === 'standard') {
                    indicator.style.transform = 'translateX(0%)';
                    btnStd.classList.add('text-slate-900');
                    btnStd.classList.remove('text-slate-400');
                    btnInt.classList.add('text-slate-400');
                    btnInt.classList.remove('text-slate-900');
                } else {
                    indicator.style.transform = 'translateX(100%)';
                    btnStd.classList.add('text-slate-400');
                    btnStd.classList.remove('text-slate-900');
                    btnInt.classList.add('text-slate-900');
                    btnInt.classList.remove('text-slate-400');
                }
            };
            
            btnStd.onclick = () => { state.groupingMode = 'standard'; updateToggleUI(); updateSidebarRegistry(); };
            btnInt.onclick = () => { state.groupingMode = 'interaction'; updateToggleUI(); updateSidebarRegistry(); };
            document.getElementById('help-btn').onclick = () => { document.getElementById('glossary-modal').classList.remove('hidden'); renderGlossary(); };
            document.getElementById('close-glossary').onclick = () => { document.getElementById('glossary-modal').classList.add('hidden'); };
            document.getElementById('glossary-search').oninput = (e) => { state.glossarySearch = e.target.value; renderGlossary(); };
            document.getElementById('glossary-show-sensors').onclick = () => { state.glossaryView = 'sensors'; renderGlossary(); };
            document.getElementById('glossary-show-actuators').onclick = () => { state.glossaryView = 'actuators'; renderGlossary(); };
        });
        window.toggleMechanism = toggleMechanism;
    </script>
</body>
</html>
